server.port=${PORT:8080}
spring.application.name=portfolio-backend

# H2 file database (zero setup, survives restarts)
spring.datasource.url=jdbc:h2:file:./data/portfolio;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

logging.level.root=WARN
logging.level.dev.asharam.portfolio=INFO

# ---- Email notifications (Gmail SMTP) ----
# Set MAIL_PASSWORD env var to a Gmail *App Password* to activate.
# Without it, messages are only saved in DB and mail is skipped safely.
portfolio.mail.from=${MAIL_FROM:asharamsaini2380@gmail.com}
portfolio.mail.to=${MAIL_TO:asharamsaini2380@gmail.com}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_FROM:asharamsaini2380@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
