server.port=${PORT:8080}
spring.application.name=portfolio-backend

# H2 file database by default (local dev, zero setup).
# On Render, set JDBC_URL / DB_USER / DB_PASS / DB_DRIVER for Postgres.
spring.datasource.url=${JDBC_URL:jdbc:h2:file:./data/portfolio;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=false

logging.level.root=WARN
logging.level.dev.asharam.portfolio=INFO

# ---- Admin (CMS) ----
# Set ADMIN_PASSWORD env var to enable the admin panel login.
portfolio.admin.password=${ADMIN_PASSWORD:}

# ---- Email notifications (Gmail SMTP) ----
# Set MAIL_PASSWORD env var to a Gmail *App Password* to activate.
# Without it, messages are only saved in DB and mail is skipped safely.
portfolio.mail.from=${MAIL_FROM:asharamsaini2380@gmail.com}
portfolio.mail.to=${MAIL_TO:asharamsaini2380@gmail.com}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_FROM:asharamsaini2380@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
